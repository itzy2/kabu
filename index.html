<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>STOCK POINT | 仮想株式市場</title>

  <meta name="theme-color" content="#0b1220">

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --card: #131e31;
      --line: #26364f;
      --text: #e8eef8;
      --muted: #9fb0c9;
      --blue: #5aa2ff;
      --green: #39d98a;
      --red: #ff6b78;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      padding: 20px 16px;
      background: #101a2b;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: .9rem;
      margin: 8px 0 5px;
    }

    input, select, button {
      font: inherit;
      border-radius: 9px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #0d1728;
      color: var(--text);
      width: 100%;
    }

    button {
      cursor: pointer;
      background: #1b4f91;
      border-color: #2c68b4;
      font-weight: 600;
    }

    button.secondary {
      background: #26364f;
      border-color: #364a68;
    }

    button.danger {
      background: #7b2836;
      border-color: #a43a4d;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 130px;
    }

    .status {
      color: var(--muted);
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    .metric {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .good {
      color: var(--green);
    }

    .bad {
      color: var(--red);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .table-wrap {
      overflow: auto;
    }

    h2 {
      font-size: 1.12rem;
      margin: 0 0 12px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    #chart-canvas {
      width: 100%;
      max-height: 360px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>STOCK POINT</h1>
    <p>株価シミュレーション</p>
  </div>

  <div class="row" style="max-width:320px">
    <span id="header-user" class="muted">未ログイン</span>
    <button id="logout-btn" class="secondary hidden">ログアウト</button>
  </div>
</header>

<main>

  <!-- ログイン -->
  <section id="auth-section" class="card">

    <h2>ログイン / 新規登録</h2>

    <div class="grid">
      <div>
        <label for="auth-email">メールアドレス</label>
        <input
          id="auth-email"
          type="email"
          autocomplete="email"
          placeholder="name@example.com">
      </div>

      <div>
        <label for="auth-password">パスワード</label>
        <input
          id="auth-password"
          type="password"
          autocomplete="current-password"
          placeholder="パスワード">
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="login-btn">ログイン</button>
      <button id="signup-btn" class="secondary">新規登録</button>
    </div>

    <p id="auth-message" class="status"></p>

  </section>

  <!-- アプリ本体 -->
  <section id="app-section" class="hidden">

    <!-- 資産情報 -->
    <section class="grid">

      <div class="card">
        <div class="muted">保有ポイント</div>
        <div id="points-value" class="metric">-</div>
      </div>

      <div class="card">
        <div class="muted">保有株式評価額</div>
        <div id="assets-value" class="metric">-</div>
      </div>

      <div class="card">
        <div class="muted">総資産</div>
        <div id="total-value" class="metric">-</div>
      </div>

      <div class="card">
        <div class="muted">ユーザー</div>
        <div id="profile-name" class="metric" style="font-size:1.15rem">-</div>
        <div id="profile-role" class="muted">-</div>
      </div>

    </section>

    <!-- 株式一覧 -->
    <section class="card">

      <div class="section-title">
        <h2>株式一覧・取引</h2>
        <span id="refresh-status" class="muted">更新待機</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>銘柄</th>
              <th>株価(pt)</th>
              <th>前日比</th>
              <th>保有株数</th>
              <th>評価額(pt)</th>
              <th>購入/売却</th>
            </tr>
          </thead>

          <tbody id="stocks-body">
            <tr>
              <td colspan="6">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p id="trade-message" class="status"></p>

    </section>

    <!-- 株価グラフ -->
    <section class="card">

      <h2>会社別株価グラフ</h2>

      <div class="row">
        <select id="stock-chart-select" aria-label="グラフ銘柄"></select>
        <button id="chart-reload" class="secondary">グラフ再読込</button>
      </div>

      <p id="chart-message" class="status">
        銘柄を選択してください。
      </p>

      <canvas id="chart-canvas"></canvas>

    </section>

    <!-- ランキング -->
    <section class="card">

      <h2>ランキング</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>順位</th>
              <th>ユーザー</th>
              <th>ポイント</th>
              <th>株式評価額</th>
              <th>総資産</th>
            </tr>
          </thead>

          <tbody id="ranking-body"></tbody>
        </table>
      </div>

    </section>

    <!-- 自分の取引履歴 -->
    <section class="card">

      <h2>自分の取引履歴</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>銘柄</th>
              <th>売買</th>
              <th>株数</th>
              <th>単価</th>
              <th>合計</th>
            </tr>
          </thead>

          <tbody id="my-transactions-body"></tbody>
        </table>
      </div>

    </section>

    <!-- 管理者 -->
    <section id="admin-section" class="card hidden">

      <h2>管理者パネル</h2>

      <div class="grid">

        <div>
          <label>対象ユーザー</label>
          <select id="admin-user-select"></select>
        </div>

        <div>
          <label>ポイント数</label>
          <input
            id="admin-points-amount"
            type="number"
            min="1"
            step="1"
            value="1000">
        </div>

        <div>
          <label>ポイント操作</label>
          <select id="admin-points-mode">
            <option value="add">追加</option>
            <option value="subtract">減算</option>
            <option value="set">設定</option>
          </select>
        </div>

      </div>

      <button id="admin-points-btn" style="margin-top:10px">
        ポイントを変更
      </button>

      <hr style="border-color:var(--line);margin:18px 0">

      <div class="grid">

        <div>
          <label>対象銘柄</label>
          <select id="admin-stock-select"></select>
        </div>

        <div>
          <label>変更後株価(pt)</label>
          <input
            id="admin-stock-price"
            type="number"
            min="1"
            value="1000">
        </div>

      </div>

      <div class="row" style="margin-top:10px">
        <button id="admin-price-btn">株価を設定</button>
        <button id="admin-random-btn" class="secondary">
          全銘柄をランダム更新
        </button>
      </div>

      <p id="admin-message" class="status"></p>

      <h2 style="margin-top:18px">全利用者の取引履歴</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>ユーザー</th>
              <th>銘柄</th>
              <th>売買</th>
              <th>株数</th>
              <th>単価</th>
              <th>合計</th>
            </tr>
          </thead>

          <tbody id="all-transactions-body"></tbody>
        </table>
      </div>

    </section>

  </section>

  <div id="global-message" class="status"></div>

</main>

<footer>
  STOCK POINT · 仮想株式市場
</footer>

<script src="app.js"></script>

</body>
</html>
